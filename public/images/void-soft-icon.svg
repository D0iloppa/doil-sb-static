<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" x="0" y="0" width="512" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="512" height="2" fill="rgba(0,0,0,0.18)"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.5)"/>
    </radialGradient>
    <!-- 베젤 입체감 — 상단/좌측 밝고 하단/우측 어두운 그라디언트 -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ddd8c4"/>
      <stop offset="45%" stop-color="#c8c0a8"/>
      <stop offset="100%" stop-color="#a89e88"/>
    </linearGradient>
  </defs>

  <!-- ─── 베젤: rx 없이 꽉 채움 — OS가 아이콘 라운딩 담당 ─── -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bezelGrad)"/>

  <!-- 베젤 내부 눌린 홈(inset shadow 느낌) -->
  <rect x="0" y="0" width="512" height="3" fill="rgba(0,0,0,0.18)"/>
  <rect x="0" y="0" width="3" height="512" fill="rgba(0,0,0,0.12)"/>
  <rect x="0" y="509" width="512" height="3" fill="rgba(255,255,255,0.25)"/>
  <rect x="509" y="0" width="3" height="512" fill="rgba(255,255,255,0.2)"/>

  <!-- ─── 화면 inset: 더 넓은 베젤 여백 ─── -->
  <!-- 오목한 홈 (어두운 테두리) -->
  <rect x="52" y="52" width="408" height="352" rx="10" ry="10" fill="#1a1a18"/>
  <!-- 실제 화면 -->
  <rect x="56" y="56" width="400" height="344" rx="7" ry="7" fill="#040d06"/>

  <!-- 화면 내부 — 인광 테두리 미광 -->
  <rect x="56" y="56" width="400" height="344" rx="7" ry="7"
        fill="none" stroke="#4dff8f" stroke-width="1" opacity="0.12"/>

  <!-- CRT 비네트 -->
  <rect x="56" y="56" width="400" height="344" rx="7" ry="7" fill="url(#vignette)"/>

  <!-- ── 화면 콘텐츠 ── -->

  <!-- 프롬프트 라인 -->
  <text x="76" y="98" font-family="'Courier New', Courier, monospace" font-size="19"
        fill="#1f8a52" filter="url(#softglow)" letter-spacing="0.5">doil@void:~$</text>

  <!-- 구분선 -->
  <line x1="76" y1="110" x2="436" y2="110" stroke="#1f8a52" stroke-width="1" opacity="0.45"/>

  <!-- VOID — 메인 타이틀 -->
  <text x="256" y="218"
        font-family="'Courier New', Courier, monospace"
        font-size="114" font-weight="bold"
        text-anchor="middle"
        fill="#4dff8f"
        filter="url(#glow)"
        letter-spacing="4">VOID</text>

  <!-- Soft — 서브타이틀 -->
  <text x="256" y="292"
        font-family="'Courier New', Courier, monospace"
        font-size="58" font-weight="bold"
        text-anchor="middle"
        fill="#4dff8f"
        filter="url(#softglow)"
        letter-spacing="16"
        opacity="0.85">Soft</text>

  <!-- 하단 상태바 -->
  <line x1="76" y1="335" x2="436" y2="335" stroke="#1f8a52" stroke-width="1" opacity="0.45"/>
  <text x="76" y="355" font-family="'Courier New', Courier, monospace" font-size="16"
        fill="#1f8a52" filter="url(#softglow)">VOID//OS v2.0</text>
  <text x="436" y="355" font-family="'Courier New', Courier, monospace" font-size="16"
        fill="#1f8a52" text-anchor="end">[RDY]</text>

  <!-- 스캔라인 오버레이 -->
  <rect x="56" y="56" width="400" height="344" rx="7" ry="7" fill="url(#scanlines)"/>

  <!-- 화면 글레어 -->
  <ellipse cx="160" cy="88" rx="70" ry="20"
           fill="rgba(255,255,255,0.04)" transform="rotate(-15,160,88)"/>

  <!-- ─── 하단 베젤 영역 (라벨 패널) ─── -->
  <!-- 라벨 오목 패널 -->
  <rect x="148" y="424" width="216" height="56" rx="4" fill="#b0a890"/>
  <rect x="150" y="426" width="212" height="52" rx="3" fill="#bdb5a0"/>
  <!-- 라벨 텍스트 -->
  <text x="256" y="458" font-family="'Courier New', Courier, monospace" font-size="15"
        text-anchor="middle" fill="#5a5248" letter-spacing="5" font-weight="bold">VOID SOFT</text>
</svg>
